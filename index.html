<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Casa del Cheff — Digital Menu Board · Día de Muertos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   LA CASA DEL CHEFF · DIGITAL MENU BOARD — EDICIÓN DÍA DE MUERTOS
   -----------------------------------------------------------------------
   Mismo diseño, mismas escenas, mismas transiciones y tipografías que el
   menú original. Lo único que cambia es la decoración y los productos:
   papel picado colgando arriba, guirnalda de cempasúchil junto al menú
   lateral, pétalos cayendo sobre las fotos, paleta naranja cempasúchil +
   rosa mexicano + morado, y la categoría "Pan de Muerto" con sus 7 piezas.

   IMÁGENES: se buscan en la carpeta local "img/" junto a este archivo, con
   el nombre exacto (incluida la extensión .jpeg) del campo `file`.
   ===================================================================== */

/* Paleta Día de Muertos: --gold = cempasúchil, --gold-deep = rosa/magenta */
:root{
  --bg:        #0D0610;
  --panel:     #1D0C22;
  --gold:      #FF9F1C;
  --gold-bright:#FFC445;
  --gold-deep: #C2185B;
  --pink:      #F0508C;
  --purple:    #7B2CBF;
  --teal:      #22C3B1;
  --ink:       #FBF1E3;
  --ink-soft:  rgba(251,241,227,0.72);
  --line:      rgba(255,159,28,0.22);

  --f-display: 'Bebas Neue', sans-serif;
  --f-body: 'Manrope', sans-serif;
  --pad: clamp(24px, 2.6vw, 54px);
  --sidebar-w: clamp(92px, 7.2vw, 124px);
}

*{ margin:0; padding:0; box-sizing:border-box; }

html,body{
  width:100%; height:100%; overflow:hidden;
  background:var(--bg); color:var(--ink);
  font-family:var(--f-body);
  -webkit-font-smoothing:antialiased;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
}

/* =========================== APP SHELL =========================== */

.app{
  width:100vw; height:100vh; position:relative;
  display:grid; grid-template-columns: var(--sidebar-w) 1fr;
  background:var(--bg); isolation:isolate;
}

/* ---- Fondo en movimiento: resplandor dorado girando lentísimo + barrido de brillo diagonal ---- */
/* OPTIMIZADO: antes era una capa de 160% con blur(10px) girando sin parar
   (muy pesado para el navegador de una TV). Los degradados ya son suaves,
   así que se quitó el blur y ahora solo se desplaza/escala (movimiento que
   la GPU hace casi gratis). */
.app::before{
  content:""; position:absolute; inset:-12%; z-index:0; pointer-events:none;
  background: radial-gradient(circle at 30% 35%, rgba(255,159,28,.14), transparent 55%),
              radial-gradient(circle at 75% 70%, rgba(194,24,91,.18), transparent 50%),
              radial-gradient(circle at 88% 14%, rgba(123,44,191,.16), transparent 45%);
  animation: glowDrift 60s ease-in-out infinite alternate; will-change:transform;
  animation-play-state:paused; /* solo corre cuando el fondo se ve (intros de categoría) */
}
@keyframes glowDrift{ from{ transform:translate3d(-2%,-1%,0) scale(1); } to{ transform:translate3d(2.5%,1.5%,0) scale(1.08); } }

/* OPTIMIZADO: el barrido ahora es una banda que se traslada (transform),
   no un background-position animado (que repintaba toda la pantalla). */
.app::after{
  content:""; position:absolute; top:0; bottom:0; left:0; width:55%; z-index:0; pointer-events:none;
  background: linear-gradient(105deg, transparent 0%, rgba(255,159,28,.07) 50%, transparent 100%);
  transform:translate3d(-120%,0,0); will-change:transform;
  animation: sheenSweep 17s linear infinite; animation-play-state:paused;
}
@keyframes sheenSweep{
  0%{ transform:translate3d(-120%,0,0); }
  100%{ transform:translate3d(260%,0,0); }
}
/* NUEVO: detrás de las fotos de producto estas dos capas NO se ven (la foto
   las tapa), pero seguían animándose y consumiendo GPU. Ahora solo corren
   en las escenas de intro de categoría, que es donde sí se ven. */
.app.bg-live::before, .app.bg-live::after{ animation-play-state:running; }

/* =========================== SIDEBAR PERSISTENTE =========================== */

.sidebar{
  position:relative; z-index:3; grid-column:1; overflow:hidden;
  display:flex; flex-direction:column; align-items:center;
  padding: clamp(18px,2vw,28px) 0;
  border-right:1px solid var(--line);
}

/* ---- partículas doradas flotando por el menú lateral (dan movimiento
   sin competir con el ícono/nombre de categoría: van por detrás, con
   z-index negativo dentro del propio stacking context del sidebar). ---- */
.sb-particles{ position:absolute; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.sbp{
  position:absolute; bottom:-6%; border-radius:50%;
  background:var(--gold-bright); box-shadow:0 0 7px rgba(255,196,69,.85);
  opacity:0; animation: sbFloat linear infinite;
}
@keyframes sbFloat{
  0%{ transform:translateY(0) translateX(0); opacity:0; }
  8%{ opacity:.9; }
  88%{ opacity:.45; }
  100%{ transform:translateY(-112vh) translateX(var(--sbp-drift,8px)); opacity:0; }
}

/* ---- las mismas partículas doradas, ahora también sobre el escenario
   principal (encima de las fotografías de producto). Van por encima de
   las capas .layer pero por debajo de nada más: pointer-events:none, y
   son pequeñas/tenues para no estorbar la lectura del nombre. ---- */
.stage-particles{ position:absolute; inset:0; z-index:6; overflow:hidden; pointer-events:none; }

.sb-logo{
  width: clamp(46px,4vw,64px); height: clamp(46px,4vw,64px);
  border-radius:50%; overflow:hidden; border:1px solid var(--line);
  background:var(--panel); flex-shrink:0;
}
.sb-logo img{ width:100%; height:100%; object-fit:cover; }

.sb-middle{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; min-height:0;
}
.sb-cat-icon{
  width:clamp(28px,2.4vw,36px); height:clamp(28px,2.4vw,36px); color:var(--gold);
  flex-shrink:0;
}
.sb-cat-icon svg{ width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.4; }
.sb-cat-name{
  writing-mode: vertical-rl; transform:rotate(180deg);
  font-family:var(--f-display); letter-spacing:.14em; font-size:clamp(13px,1.05vw,18px);
  color:var(--ink); white-space:nowrap; max-height:52vh; overflow:hidden;
}

.sb-progress{
  width:2px; height:clamp(60px,10vh,120px); background:rgba(251,241,227,.14);
  border-radius:2px; position:relative; overflow:hidden; flex-shrink:0;
}
.sb-progress-fill{
  position:absolute; left:0; top:0; width:100%; background:linear-gradient(180deg,var(--gold-bright),var(--pink));
  border-radius:2px; transition:height .6s cubic-bezier(.22,1,.36,1);
}

.sidebar.hidden{ opacity:0; pointer-events:none; }

/* =========================== STAGE / CAPAS =========================== */

.stage{ position:relative; z-index:1; grid-column:2; overflow:hidden; }
.layer{ position:absolute; inset:0; opacity:0; will-change:opacity; }
/* NUEVO: la escena siguiente se arma y decodifica en segundo plano con las
   animaciones en pausa; arrancan todas juntas cuando empieza la transición. */
.layer.preparing *, .layer.preparing *::before, .layer.preparing *::after{ animation-play-state:paused !important; }
.layer.active{ opacity:1; z-index:2; }

/* ---- Transiciones de escena: familia de fundidos/degradados premium.
   El motor en JS elige una al azar en cada cambio de escena, aplicando
   la animación directamente sobre las capas .layer (sin paneles). ---- */

@keyframes layerFadeOut{ from{ opacity:1; } to{ opacity:0; } }
@keyframes layerFadeIn{  from{ opacity:0; } to{ opacity:1; } }

/* -- 1. Fundido con leve avance/retroceso de escala (cinematográfico) -- */
@keyframes layerFadeZoomOut{ from{ opacity:1; transform:scale(1); } to{ opacity:0; transform:scale(1.045); } }
@keyframes layerFadeZoomIn{  from{ opacity:0; transform:scale(1.045); } to{ opacity:1; transform:scale(1); } }

/* -- 2. Fundido a negro (dip clásico) -- */
@keyframes blackDip{ 0%{ opacity:0; } 46%{ opacity:1; } 54%{ opacity:1; } 100%{ opacity:0; } }

/* -- 3. Fundido con velo dorado (degradado que recorre la pantalla) -- */
.sweep-veil{ position:absolute; inset:0; z-index:15; pointer-events:none; opacity:0; overflow:hidden; }
.sweep-veil i{
  position:absolute; top:0; bottom:0; left:0; width:70%; transform:translate3d(-100%,0,0);
  background: linear-gradient(100deg, transparent 0%, rgba(255,214,120,.30) 38%, rgba(255,196,69,.5) 50%, rgba(255,214,120,.30) 62%, transparent 100%);
}
@keyframes sweepShimmer{ 0%{ opacity:0; } 35%{ opacity:.85; } 65%{ opacity:.85; } 100%{ opacity:0; } }
@keyframes sweepBand{ from{ transform:translate3d(-100%,0,0); } to{ transform:translate3d(155%,0,0); } }

.black-veil{ position:absolute; inset:0; z-index:15; pointer-events:none; background:#0A0310; opacity:0; }

/* =========================== ENTRADAS DESDE LAS ESQUINAS =========================== */

@keyframes enterTL{ from{opacity:0; transform:translate(-46px,-30px);} to{opacity:1; transform:translate(0,0);} }
@keyframes enterTR{ from{opacity:0; transform:translate(46px,-30px);} to{opacity:1; transform:translate(0,0);} }
@keyframes enterBL{ from{opacity:0; transform:translate(-46px,30px);} to{opacity:1; transform:translate(0,0);} }
@keyframes enterBR{ from{opacity:0; transform:translate(46px,30px);} to{opacity:1; transform:translate(0,0);} }
@keyframes enterUp{ from{opacity:0; transform:translateY(28px);} to{opacity:1; transform:translateY(0);} }

.from-tl{ opacity:0; animation:enterTL .8s cubic-bezier(.16,1,.3,1) forwards; }
.from-tr{ opacity:0; animation:enterTR .8s cubic-bezier(.16,1,.3,1) forwards; }
.from-bl{ opacity:0; animation:enterBL .8s cubic-bezier(.16,1,.3,1) forwards; }
.from-br{ opacity:0; animation:enterBR .8s cubic-bezier(.16,1,.3,1) forwards; }
.from-up{ opacity:0; animation:enterUp .8s cubic-bezier(.16,1,.3,1) forwards; }

/* =========================== ESCENA BASE =========================== */

.scene{ position:relative; width:100%; height:100%; padding:var(--pad); overflow:hidden; }

.eyebrow{
  font-size:clamp(11px,.85vw,13px); letter-spacing:.3em; text-transform:uppercase;
  color:var(--gold); font-weight:700;
}
h1,h2,h3{ font-family:var(--f-display); text-transform:uppercase; letter-spacing:.02em; color:var(--ink); font-weight:400; }

/* ---- media helper ---- */
.media{ position:relative; width:100%; height:100%; overflow:hidden; border-radius:inherit; }
.media img{ width:100%; height:100%; object-fit:cover; }
.media-fallback{ position:absolute; inset:0; display:none; background:linear-gradient(135deg,#2b1030,#0D0610); align-items:center; justify-content:center; color:var(--ink-soft); font-size:12px; text-align:center; padding:10px; }
.media-fallback span{ display:block; }

@keyframes punchZoom{ from{ transform:scale(1.32); } to{ transform:scale(1); } }
@keyframes kenburns{ from{ transform:scale(1) translate(0,0);} to{ transform:scale(1.12) translate(-1.2%,-1%);} }
/* OPTIMIZADO: antes eran DOS animaciones encadenadas sobre la foto y la segunda
   quedaba corriendo en bucle infinito. Ahora es UNA sola, finita (8 s = lo que
   dura la escena + la transición), con el mismo look: golpe de zoom inicial
   y avance lento después. */
@keyframes kbPunch{
  0%  { transform:scale(1.32) translate(0,0);        animation-timing-function:cubic-bezier(.22,1,.36,1); }
  12% { transform:scale(1) translate(0,0);           animation-timing-function:ease-in-out; }
  100%{ transform:scale(1.045) translate(-.45%,-.35%); }
}
.media img.kb{ will-change:transform; animation: kbPunch 8s linear forwards; }

/* OPTIMIZADO: antes se animaba el text-shadow (sombras de hasta 95px que se
   volvían a calcular en cada fotograma). Ahora hay DOS capas de brillo: la
   suave (en el propio texto) y la intensa (en ::after), y solo se anima la
   opacidad de la intensa. Se ve igual, pero cuesta una fracción. */
@keyframes glowBreath{ 0%,100%{ opacity:0; } 50%{ opacity:1; } }

/* =========================== ESCENA · PORTADA =========================== */

.scene-cover{ position:fixed; inset:0; z-index:50; padding:0; }
.cover-media{ position:absolute; inset:0; }
.cover-media img{ width:100%; height:100%; object-fit:cover; animation:kenburns 30s ease-in-out forwards; will-change:transform; }
.cover-scrim{ position:absolute; inset:0; background:linear-gradient(0deg, rgba(12,4,14,.88) 0%, rgba(12,4,14,.38) 42%, rgba(12,4,14,.08) 66%, transparent 100%); }
.cover-content{
  position:absolute; left:var(--pad); right:var(--pad); bottom:clamp(46px,7vw,100px);
  max-width:900px;
}
.cover-eyebrow{ color:var(--gold-bright); }
.cover-title{
  margin-top:10px; font-size:clamp(58px,7.2vw,136px); line-height:.94; color:var(--ink);
  text-shadow:0 6px 34px rgba(0,0,0,.65);
}
.cover-tagline{
  margin-top:clamp(10px,1.2vw,16px); font-size:clamp(13px,1vw,17px); letter-spacing:.32em;
  text-transform:uppercase; color:var(--gold); font-weight:600;
}
.cover-sub{
  margin-top:clamp(18px,2.2vw,30px); font-size:clamp(17px,1.5vw,24px); color:var(--ink-soft);
  max-width:46ch; line-height:1.65;
}

/* =========================== ESCENA · INTRO DE CATEGORÍA (FILOSOFÍA) =========================== */

.scene-catintro{ display:flex; align-items:center; justify-content:center; }
.catintro-inner{ max-width:900px; text-align:left; }
.ci-block{ margin-bottom:clamp(30px,3.4vw,50px); }
.ci-block:last-child{ margin-bottom:0; }
.ci-block.ci-divider{ padding-top:clamp(26px,3vw,44px); border-top:1px dashed rgba(255,159,28,.4); }
.catintro-inner h2{ font-size:clamp(34px,3.8vw,62px); line-height:.98; margin:10px 0 clamp(14px,1.6vw,22px); }
.catintro-inner p{
  font-size:clamp(15px,1.15vw,19px); line-height:1.75; color:var(--ink-soft); max-width:64ch;
}

/* =========================== ESCENA · PRODUCTO A PANTALLA COMPLETA =========================== */
/* Un producto por página: la foto cubre TODO el área de exhibición
   (misma técnica que la portada) y el nombre + los badges de confianza
   flotan encima, legibles gracias a un degradado oscuro por detrás. */

.scene.scene-products{ padding:0; }
.scene-products{ position:relative; height:100%; }

.pp-media{ position:absolute; inset:0; }
.pp-scrim{
  position:absolute; inset:0;
  background:
    linear-gradient(0deg, rgba(12,4,14,.92) 0%, rgba(12,4,14,.62) 20%, rgba(12,4,14,.08) 44%, transparent 58%),
    linear-gradient(180deg, rgba(12,4,14,.4) 0%, transparent 22%);
}

.pp-content{
  position:absolute; left:var(--pad); right:var(--pad); bottom:clamp(96px,13vh,158px); z-index:5;
}
.pp-name{
  opacity:0;
  font-family:var(--f-display); text-transform:uppercase; font-weight:400;
  font-size:clamp(60px,7.4vw,132px); line-height:.94; letter-spacing:.02em; color:var(--ink);
  max-width:22ch; position:relative;
  text-shadow:0 0 14px rgba(255,159,28,.4), 0 0 34px rgba(255,159,28,.2), 0 0 60px rgba(230,57,127,.14);
  animation: enterUp .8s cubic-bezier(.16,1,.3,1) .18s forwards;
}
.pp-name::after{
  content:attr(data-text); position:absolute; left:0; top:0; width:100%;
  color:transparent; pointer-events:none; opacity:0;
  text-shadow:0 0 22px rgba(255,196,69,1), 0 0 55px rgba(255,159,28,.7), 0 0 95px rgba(230,57,127,.42);
  animation: glowBreath 2.8s ease-in-out 1s infinite; will-change:opacity;
}

/* =========================== BADGES DE CONFIANZA (pie de página) =========================== */

.trust-footer{
  position:absolute; left:var(--pad); right:var(--pad); bottom:clamp(16px,2vw,26px);
  display:flex; justify-content:center; gap:clamp(20px,2.6vw,44px);
}
.trust-item{
  display:flex; align-items:center; gap:8px; color:var(--ink-soft);
  font-size:clamp(9.5px,.68vw,11.5px); letter-spacing:.14em; text-transform:uppercase; font-weight:600;
}
.trust-item svg{ width:clamp(14px,1.05vw,18px); height:clamp(14px,1.05vw,18px); color:var(--gold); flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.5; }

/* =====================================================================
   CAPA DÍA DE MUERTOS — decoración (no altera el layout original)
   ===================================================================== */

/* ---- Papel picado colgando arriba ---- */
.picado{
  position:absolute; z-index:5; top:0; left:var(--sidebar-w); right:0;
  display:flex; align-items:flex-start; gap:clamp(5px,.5vw,10px); padding:0 clamp(5px,.5vw,10px);
  pointer-events:none; transition:left .6s cubic-bezier(.22,1,.36,1);
}
.app.is-cover .picado{ left:0; }
.pk-line{ position:absolute; left:0; right:0; top:0; height:2px; background:rgba(255,196,69,.75); }
.pf{
  display:block; flex:1 1 0; min-width:0; height:auto; aspect-ratio:60/48;
  transform-origin:50% 0;
}
/* OPTIMIZADO: antes las 22 banderitas se mecían (22 capas animadas para siempre
   + opacity:.94 en cada una). Ahora solo se mece 1 de cada N (ver CONFIG) y la
   transparencia va dentro del propio dibujo (fill-opacity). */
.pf.sw{ animation:pfSway 5s ease-in-out infinite alternate; will-change:transform; }
@keyframes pfSway{ from{ transform:rotate(-2.4deg); } to{ transform:rotate(2.4deg); } }

/* ---- Guirnalda de cempasúchil sobre el borde del menú lateral ---- */
.garland{
  position:absolute; z-index:4; top:0; bottom:0; left:calc(var(--sidebar-w) - 7px); width:14px;
  pointer-events:none; transition:opacity .5s;
  background:
    radial-gradient(circle at 50% 50%, #FFE08A 0 1.6px, #FFB02E 2.2px 4.4px, #E8780C 4.9px 6px, transparent 6.6px) 0 0 / 14px 16px repeat-y,
    linear-gradient(90deg, transparent 6.2px, rgba(255,159,28,.55) 6.2px 7.8px, transparent 7.8px);
}
.app.is-cover .garland{ opacity:0; }

/* ---- Flor de cempasúchil al pie del menú lateral ---- */
.sb-flower{ width:clamp(34px,3vw,50px); height:clamp(34px,3vw,50px); margin-top:14px; flex-shrink:0; animation:flowerSpin 48s linear infinite; }
.sb-flower svg{ width:100%; height:100%; display:block; }
@keyframes flowerSpin{ to{ transform:rotate(360deg); } }

/* ---- Pétalos de cempasúchil cayendo sobre el escenario ---- */
.petal{
  position:absolute; top:0; opacity:0; border-radius:70% 0 70% 0;
  background:linear-gradient(135deg, var(--p1), var(--p2));
  animation:petalFall linear infinite; will-change:transform;
}
@keyframes petalFall{
  0%  { transform:translate3d(0,-8vh,0) rotate(0deg); opacity:0; }
  8%  { opacity:.85; }
  25% { transform:translate3d(var(--dx),22vh,0) rotate(120deg); }
  50% { transform:translate3d(calc(var(--dx) * -.6),52vh,0) rotate(240deg); }
  75% { transform:translate3d(calc(var(--dx) * .8),82vh,0) rotate(330deg); }
  92% { opacity:.6; }
  100%{ transform:translate3d(0,112vh,0) rotate(420deg); opacity:0; }
}

/* =====================================================================
   MODOS DE RENDIMIENTO (los activa solo el menú si detecta que va lento;
   también se pueden forzar con ?modo=lite  /  ?modo=ultra  /  ?modo=normal)
   ===================================================================== */
.lite .app::after{ display:none; }
.lite .app::before{ animation:none; }
.lite .sb-particles, .lite .sb-flower{ display:none; }
.lite .pf.sw{ animation:none; }
.lite .picado{ transition:none; }
.lite .petal:nth-child(n+4){ display:none; }
.lite .pp-name::after{ animation:none; opacity:.55; }

.ultra .petal{ display:none; }
.ultra .pp-name::after{ display:none; }
.ultra .media img.kb, .no-kb .media img.kb{ animation: punchZoom .95s cubic-bezier(.22,1,.36,1) forwards; }
.ultra .cover-media img{ animation:none; }
.ultra .app::before{ display:none; }

</style>
</head>
<body>

<div class="app">

  <div class="picado" id="picado" aria-hidden="true"></div>
  <div class="garland" aria-hidden="true"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sb-particles" aria-hidden="true">
      <i class="sbp" style="left:12%; width:2px; height:2px; --sbp-drift:6px; animation-duration:9.5s; animation-delay:0s;"></i>
      <i class="sbp" style="left:32%; width:3px; height:3px; --sbp-drift:-8px; animation-duration:12.5s; animation-delay:2.6s;"></i>
      <i class="sbp" style="left:55%; width:2px; height:2px; --sbp-drift:9px; animation-duration:10.8s; animation-delay:5.1s;"></i>
      <i class="sbp" style="left:75%; width:2.5px; height:2.5px; --sbp-drift:-6px; animation-duration:14s; animation-delay:1.2s;"></i>
      <i class="sbp" style="left:22%; width:2.5px; height:2.5px; --sbp-drift:5px; animation-duration:11.2s; animation-delay:6.8s;"></i>
      <i class="sbp" style="left:48%; width:2px; height:2px; --sbp-drift:-9px; animation-duration:9.8s; animation-delay:3.7s;"></i>
      <i class="sbp" style="left:68%; width:3px; height:3px; --sbp-drift:7px; animation-duration:13.4s; animation-delay:8.2s;"></i>
      <i class="sbp" style="left:8%; width:2.5px; height:2.5px; --sbp-drift:-5px; animation-duration:10.2s; animation-delay:4.4s;"></i>
    </div>
    <div class="sb-logo"><img src="img/Isologo.jpeg" alt="La Casa del Cheff" onerror="this.style.display='none'"></div>
    <div class="sb-middle">
      <div class="sb-cat-icon" id="sb-cat-icon"></div>
      <div class="sb-cat-name" id="sb-cat-name"></div>
      <div class="sb-progress"><div class="sb-progress-fill" id="sb-progress-fill"></div></div>
    </div>
    <div class="sb-flower" id="sbFlower" aria-hidden="true"></div>
  </aside>

  <main class="stage" id="stage">

   (incluidas las fotos de producto), reutilizando el mismo estilo visual
   que ya tenían las del sidebar (.sbp / @keyframes sbFloat). ---- */
(function initStageParticles(){

  const COLORS = [
    ['#FFC445','#FF9F1C'], ['#FF9F1C','#E0640A'], ['#FFD23F','#FF9F1C'],

  }
})();

/* ---- catálogo de transiciones: familia de fundidos/degradados premium.
   Cada una anima la capa saliente y la entrante directamente (opacity
   +/- transform), sin paneles que se deslicen por encima. ---- */
const EASE = 'cubic-bezier(.45,0,.2,1)';
const TRANSITIONS = [
  { // 1. fundido simple (disolvencia clásica)
    name:'fade', duration: 950,
    run(outgoing, incoming){
      outgoing.style.animation = `layerFadeOut ${950}ms ${EASE} forwards`;
      incoming.style.animation = `layerFadeIn ${950}ms ${EASE} forwards`;
    }
  },
  { // 2. fundido con leve avance de escala (look cinematográfico)
    name:'zoom', duration: 1150,
    run(outgoing, incoming){
      outgoing.style.animation = `layerFadeZoomOut 1150ms ${EASE} forwards`;
      incoming.style.animation = `layerFadeZoomIn 1150ms ${EASE} forwards`;
    }
  },
  { // 3. fundido con velo dorado degradado
    name:'veil', duration: 1050,
    run(outgoing, incoming){
      outgoing.style.animation = `layerFadeOut 1050ms ${EASE} forwards`;
      incoming.style.animation = `layerFadeIn 1050ms ${EASE} forwards`;
      sweepVeil.style.animation = `sweepShimmer 1050ms ease forwards`;
      sweepVeil.firstElementChild.style.animation = `sweepBand 1050ms ease forwards`;
    },
    cleanup(){ sweepVeil.style.animation = 'none'; sweepVeil.firstElementChild.style.animation = 'none'; }
  },
  { // 4. fundido a negro (dip cinematográfico)
    name:'dip', duration: 1200,
    run(outgoing, incoming){
      outgoing.style.animation = `layerFadeOut 520ms ${EASE} forwards`;
      incoming.style.animation = `layerFadeIn 520ms ${EASE} 640ms forwards`;
      blackVeil.style.animation = `blackDip 1200ms ease forwards`;
    },
    cleanup(){ blackVeil.style.animation = 'none'; }
  }
];
let lastTransitionIdx = -1;
let perfLevel = 0;                      // 0 normal · 1 lite · 2 ultra
const TPOOL = TRANSITIONS.filter(function(t){ return CONFIG.transitions.indexOf(t.name) !== -1; });
if (!TPOOL.length) TPOOL.push(TRANSITIONS[0]);
function pickTransition(){
  if (perfLevel > 0) return TRANSITIONS[0];          // en modo lite/ultra: solo fundido simple
  let idx;
  do { idx = Math.floor(Math.random() * TPOOL.length); } while (idx === lastTransitionIdx && TPOOL.length > 1);
  lastTransitionIdx = idx;
  return TPOOL[idx];
}
const sbIcon = document.getElementById('sb-cat-icon');
const sbName = document.getElementById('sb-cat-name');
const sbFill = document.getElementById('sb-progress-fill');

const appEl = document.querySelector('.app');
function updateSidebar(scene, idx){
  appEl.classList.toggle('is-cover', scene.sidebar === false);
  appEl.classList.toggle('bg-live', scene.type === 'catintro');
  if (scene.sidebar === false){
    sidebar.classList.add('hidden');
    return;
  }
  sidebar.classList.remove('hidden');
  sbIcon.innerHTML = scene.icon || '';
  sbName.textContent = scene.category || '';
  sbFill.style.height = (((idx + 1) / scenes.length) * 100).toFixed(1) + '%';
}

/* =====================================================================
   OPTIMIZADO: la escena siguiente se ARMA y se DECODIFICA en segundo plano
   (en la capa libre, invisible, con animaciones en pausa) mientras la
   escena actual está estable. Antes el JPEG se decodificaba justo al
   empezar la transición, que es lo que producía el tirón al cambiar.
   ===================================================================== */
let activeIdx = 0;
let sceneIdx = 0;
let firstRun = true;
let prepared = null;

function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

function prepareScene(idx){
  const layer = layers[1 - activeIdx];
  const scene = scenes[idx];
  layer.style.animation = '';
  layer.style.zIndex = '';
  layer.className = 'layer preparing';
  layer.innerHTML = RENDERERS[scene.type](scene.data);
  const img = layer.querySelector('.media img');
  const decoded = (img && img.decode) ? img.decode().catch(function(){}) : Promise.resolve();
  prepared = { idx: idx, layer: layer, ready: Promise.race([decoded, wait(3000)]) };
}

function playScene(){
  const idx = sceneIdx;
  // recarga preventiva (libera memoria del navegador de la TV) justo al iniciar un ciclo
  if (idx === 0 && !firstRun && CONFIG.reloadAfterHours > 0 &&
      performance.now() > CONFIG.reloadAfterHours * 3600000){ location.reload(); return; }
  if (!prepared || prepared.idx !== idx) prepareScene(idx);
  const p = prepared; prepared = null;
  p.ready.then(function(){ startScene(idx, p.layer); });
}

function startScene(idx, incoming){
  const scene = scenes[idx];
  incoming.classList.remove('preparing');
  void incoming.offsetWidth;

  updateSidebar(scene, idx);

  let settle = 0;
  if (firstRun){
    incoming.classList.add('active');
    firstRun = false;
  } else {
    const outgoing = layers[activeIdx];
    const t = pickTransition();
    settle = t.duration;

    incoming.style.zIndex = 3;
    t.run(outgoing, incoming);

    setTimeout(function(){
      outgoing.classList.remove('active');
      outgoing.style.animation = '';
      outgoing.innerHTML = '';
      incoming.classList.add('active');
      incoming.style.animation = '';
      incoming.style.zIndex = '';
      if (t.cleanup) t.cleanup();
    }, t.duration);
  }

  activeIdx = 1 - activeIdx;
  const nextIdx = (idx + 1) % scenes.length;
  sceneIdx = nextIdx;

  // cuando la transición ya terminó y la capa vieja se vació, arma la siguiente
  setTimeout(function(){ prepareScene(nextIdx); }, settle + 250);
  setTimeout(playScene, scene.duration);
}

/* =====================================================================
   5. MODO AUTOMÁTICO DE RENDIMIENTO
   Mide los fotogramas reales que logra el navegador de la TV. Si ve que se
   traba, apaga primero los efectos más pesados (nivel 1 = "lite") y, si
   sigue lento, también el zoom de las fotos y los pétalos (nivel 2 = "ultra").
   Solo baja de nivel (no sube) para evitar parpadeos de efectos.
   Se puede forzar con la URL:  ...index.html?modo=lite | ultra | normal
   ===================================================================== */
function setPerf(level){
  perfLevel = level;
  document.body.classList.toggle('lite', level >= 1);
  document.body.classList.toggle('ultra', level >= 2);
}
if (!CONFIG.kenBurns) document.body.classList.add('no-kb');

(function perfMonitor(){
  const KEY = 'menuPerf';
  function save(v){ try{ localStorage.setItem(KEY, String(v)); }catch(e){} }
  const m = /[?&]modo=(\w+)/.exec(location.search);
  const forced = m ? m[1] : '';
  if (forced === 'lite')   { setPerf(1); return; }
  if (forced === 'ultra')  { setPerf(2); return; }
  if (forced === 'normal') { save(0); return; }

  // NUEVO: recuerda el nivel que ya aprendió (sobrevive a recargas) para no
  // volver a empezar en "normal" y pasar por los tirones otra vez.
  let saved = 0;
  try{ saved = parseInt(localStorage.getItem(KEY), 10) || 0; }catch(e){}
  if (saved > 0) setPerf(Math.min(saved, 2));
  if (perfLevel >= 2) return;

  const WINDOW_MS = 6000, WARMUP_MS = 5000, OK_TO_STOP = 3;
  let stamps = [], winStart = 0, okStreak = 0, done = false;
  const started = performance.now();

  function evaluate(){
    if (stamps.length < 20) return;
    const dt = [];
    for (let i = 1; i < stamps.length; i++) dt.push(stamps[i] - stamps[i-1]);
    dt.sort(function(a,b){ return a - b; });
    const avg = dt.reduce(function(a,b){ return a + b; }, 0) / dt.length;
    const p90 = dt[Math.floor(dt.length * 0.9)];
    const fps = 1000 / avg;
    // trabado = menos de ~26 fps promedio, o saltos frecuentes de más de 60 ms
    if ((fps < 26 || p90 > 60) && perfLevel < 2){ setPerf(perfLevel + 1); save(perfLevel); okStreak = 0; }
    else okStreak++;
    // NUEVO: deja de medir cuando ya se estabilizó (o ya está en el nivel más bajo);
    // antes el requestAnimationFrame de medición corría para siempre.
    if (okStreak >= OK_TO_STOP || perfLevel >= 2) done = true;
  }

  function frame(t){
    if (done) return;
    if (t - started > WARMUP_MS){
      if (!winStart) winStart = t;
      stamps.push(t);
      if (t - winStart >= WINDOW_MS){ evaluate(); stamps = []; winStart = t; }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

playScene();

})();
</script>
